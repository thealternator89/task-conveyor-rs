[package]
name = "task-conveyor-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
global-hotkey = "0.6"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "f0d896f2c18a543335eb155f729d36b624695591" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "f0d896f2c18a543335eb155f729d36b624695591", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
muda = "0.15"
notify = "8.0"
open = "5.3"
raw-window-handle = "0.6"
regex = "1.11"
rfd = "0.15"
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
single-instance = "0.3"
smol = "2.0"
tray-icon = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_Common",
] }

[dev-dependencies]
tempfile = "3.0"

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.dev.package]
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
serde_json = { opt-level = 3 }


